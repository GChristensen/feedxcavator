# TLS and HTTP/2 are left to nginx. Feedxcavator listens on plain HTTP, port 10000.

server {
    listen 11000 ssl;
    http2 on;
    server_name feeds;

    ssl_certificate     /etc/nginx/certs/feeds.crt;
    ssl_certificate_key /etc/nginx/certs/feeds.key;

    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # media streamed through /image and /forward
        proxy_read_timeout 300s;
    }

    # With `x-accel: /protected-blobs/` in config.yml, /image/<id> answers with X-Accel-Redirect
    # and nginx serves the file itself, with ranges and ETags.
    location /protected-blobs/ {
        internal;
        alias /home/user/feedxcavator/data/files/blob/;
    }
}
