[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedxcavator"
version = "4.0.0"
description = "Self-hosted server that turns web pages into feeds"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "django-ninja>=1.3",
    "uvicorn>=0.30",
    "dj-database-url>=2.2",
    "curl_cffi>=0.7",
    "parsel>=1.9",
    "lxml>=5",
    "hy>=1.0",
    "hyrule>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "ruamel.yaml>=0.18",
    "croniter>=3",
    "cron-descriptor>=1.4",
    "watchfiles>=0.22",
    "jmespath>=1",
    "psutil>=5.9",
    "trafilatura>=1.12",
    "extruct>=0.17",
    "feedparser>=6",
    "python-dateutil>=2.9",
    "tzlocal>=5",
    "tzdata",
    "markdown>=3.6",
    "telethon>=1.36",
    "python-socks>=2.4",
    "patchright>=1.50",
    "edn_format>=0.7",
]

[project.optional-dependencies]
camoufox = ["camoufox>=0.4"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
feedxcavator = "feedxcavator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["feedxcavator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -p no:django"
